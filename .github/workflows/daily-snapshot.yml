name: Daily snapshot

on:
  schedule:
    - cron: "37 19 * * *"   # 19:37 UTC, same time as the existing snapshots (20:37 Skopje in winter); GitHub may start it a few minutes late
  workflow_dispatch:        # "Run workflow" button for a manual run

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Skopje
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Take snapshot
        run: python3 scripts/run_ci.py

      - name: Build page data
        run: python3 scripts/build_site_data.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tracker/snapshots data
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "snapshot $(date +%F)"
          git push
